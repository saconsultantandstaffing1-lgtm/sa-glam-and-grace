<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Image – Full Ultra HD Preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #EAE6DF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 2.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #111;
    }
    .header-box {
      max-width: 1400px;
      width: 100%;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    p {
      color: #666;
      font-size: 0.95rem;
    }
    .banner-container {
      max-width: 1440px;
      width: 100%;
      background: #FAF7F3;
      border-radius: 12px;
      box-shadow: 0 16px 45px rgba(0,0,0,0.14);
      border: 1px solid #E2DCD5;
      overflow: hidden;
    }
    .hero-img-wrap {
      width: 100%;
      position: relative;
      background: #FAF7F3;
    }
    .hero-img-wrap img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }
    .footer-bar {
      padding: 1.2rem 2rem;
      background: #FFFFFF;
      border-top: 1px solid #E5E0D8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.95rem;
      color: #333;
    }
    .save-badge {
      background: #D25C6A;
      color: #FFF;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 0.45rem 1.1rem;
      border-radius: 20px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <div class="header-box">
    <h1>Full Ultra-HD Hero Image (Complete Top &amp; Flowers Visible)</h1>
    <p>The entire image is now shown with 100% top visibility — no head or flower cutoff:</p>
  </div>

  <div class="banner-container">
    <div class="hero-img-wrap">
      <img src="images/hero_banner.jpg" alt="Hero Banner – Western Gown & Pink Flowers" />
    </div>

    <div class="footer-bar">
      <span><strong>Step 1:</strong> Full Image View (Complete Head, Flowers, &amp; Dress Visible)</span>
      <span class="save-badge">100% VISIBLE</span>
    </div>
  </div>

</body>
</html>
